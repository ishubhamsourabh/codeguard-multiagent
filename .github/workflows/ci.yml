name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  # CI must never call the paid LLM backend: the test suite uses fakes.
  CODEGUARD_MAX_ITERATIONS: "2"
  CODEGUARD_PYTEST_TIMEOUT: "30"

jobs:
  quality-gate:
    name: lint + unit tests + self-gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff

      - name: Lint (ruff)
        run: ruff check src eval api.py tests

      - name: Format check (ruff)
        run: ruff format --check src eval api.py tests

      - name: Unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest tests -q --junitxml=reports/junit.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.python-version }}
          path: reports/junit.xml
          if-no-files-found: ignore

  self-gate:
    name: dogfood — run the gate on our own source
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Scan the codebase with the deterministic gate
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import pathlib
          import sys

          from src.agents.static_security_agent import blocking_issues, scan_source

          failures = []
          for path in sorted(pathlib.Path("src").rglob("*.py")):
              issues = blocking_issues(scan_source(path.read_text(encoding="utf-8")))
              if issues:
                  failures.append((path, issues))

          for path, issues in failures:
              print(f"::error file={path}::{len(issues)} blocking finding(s)")
              for issue in issues:
                  print(f"  {path}:{issue['line']} [{issue['severity']}] "
                        f"{issue['code']}: {issue['message']}")

          if failures:
              sys.exit(1)
          print("No blocking findings in src/ — gate passed.")
          PY

  api-contract:
    name: fastapi contract tests
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install httpx
      - name: Start API and probe health
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          uvicorn api:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null; then
              echo "API is up"
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS -X POST http://127.0.0.1:8000/scan \
            -H 'Content-Type: application/json' \
            -d '{"code": "API_KEY = \"sk-live-9f8a7b6c5d4e3f2a1b0c\"\n"}'
          pkill -f "uvicorn api:app" || true
